[project]
name = "oriel"
version = "0.1.0"
description = "A portable text gateway core"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = [
    "mutmut==3.8.0",
]

[tool.mutmut]
source_paths = ["oriel/"]
on_dependency_change = "rerun"
pytest_add_cli_args_test_selection = [
    "tests/test_core.py",
    "tests/test_startup.py",
    "tests/test_http.py",
]
